# Bank-Vaults external configuration FRAGMENT, applied to OpenBao namespace team-a.
# The namespace and kubernetes-workloads auth connection must already be configured.
# Supply actual cluster CA/API, reviewed TokenReview identity and audience separately.
# This file is configuration data, not a Kubernetes resource.
# Configure with a namespace-scoped configurer identity; no root token is included.
secrets:
- path: secret
  type: kv
  options:
    version: 2
policies:
- name: demo-api-read
  rules: |
    path "secret/data/demo/api" { capabilities = ["read"] }
- name: demo-reloader-read
  rules: |
    path "secret/data/demo/api" { capabilities = ["read"] }
auth:
- type: kubernetes
  path: kubernetes-workloads
  roles:
  - name: demo-api-read
    bound_service_account_names: [demo-api]
    bound_service_account_namespaces: [demo-app]
    policies: [demo-api-read]
    # Replace with the actual audience accepted by this cluster's TokenReview API.
    audience: https://kubernetes.default.svc.cluster.local
    token_no_default_policy: true
    ttl: 10m
    max_ttl: 30m
  - name: demo-reloader
    bound_service_account_names: [demo-reloader]
    bound_service_account_namespaces: [bank-vaults]
    policies: [demo-reloader-read]
    audience: https://kubernetes.default.svc.cluster.local
    token_no_default_policy: true
    ttl: 10m
    max_ttl: 30m
# Provision secret/data/demo/api out of band, without plaintext secret values in Git.
# The reloader reads the KV data response, not only metadata: constrain its paths.
