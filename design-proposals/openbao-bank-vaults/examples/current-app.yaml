# EXISTING Cozystack API. Illustrates today's managed app, not the proposed backend.
# Namespace must already be provisioned by Cozystack.
# Default single-replica storage is file; listener TLS is disabled by the current template.
apiVersion: apps.cozystack.io/v1alpha1
kind: OpenBAO
metadata:
  name: secrets
  namespace: tenant-example
spec:
  replicas: 1
  size: 10Gi
  storageClass: replicated
  resources: {}
  resourcesPreset: t1.small
  external: false
  ui: true
  seal:
    type: shamir
    secretName: ""
    keyId: ""
